{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="uz">
<head><meta charset="UTF-8"><title>Yangi parol o'rnatish</title>
<style>
    body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
    .box { background: white; padding: 30px; border-radius: 12px; width: 400px; text-align: center; }
    form { text-align: left; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; }
</style>
</head>
<body>
    <div class="box">
        <h2>Yangi parol</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Parolni yangilash</button>
        </form>
    </div>
</body>
</html>
