{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8"><title>Parolni tiklash</title>
    <style>
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Parolni tiklash</h2>
        <p style="color: #666; font-size: 14px;">Emailingizni kiriting, biz sizga tiklash havolasini yuboramiz.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.email }}
            <button type="submit">Havolani yuborish</button>
        </form>
        <p style="margin-top: 20px;"><a href="{% url 'login' %}" style="text-decoration: none; color: #1877f2;">Orqaga qaytish</a></p>
    </div>
</body>
</html>
