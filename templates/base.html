<!-- ======================= base.html ======================= -->
<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %} Blog2 {% endblock title %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom style -->
    <style>
        body {
            background: #f5f7fa;
        }

        .navbar-brand {
            font-weight: bold;
            letter-spacing: 1px;
        }

        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .btn-primary {
            border-radius: 10px;
            padding: 8px 18px;
        }

        footer {
            margin-top: 80px;
            padding: 30px 0;
            background: #212529;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Blog2</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Bosh sahifa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'password_change' %}">Parolni almashtirish</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            Profil
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{% url 'article_new' %}">➕ Post qo'shish</a></li>
                            <li><a class="dropdown-item" href="#">⚙️ Accountni tahrirlash</a></li>
                        </ul>
                    </li>
                </ul>

                <!-- SEARCH -->
                <form class="d-flex me-3">
                    <input class="form-control me-2" type="search" placeholder="Saytdan izlash...">
                    <button class="btn btn-outline-light" type="submit">Qidiruv</button>
                </form>

                <!-- LOGOUT -->
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger btn-sm" type="submit">Chiqish</button>
                </form>
            </div>
        </div>
    </nav>


    <!-- GREETING -->
    <div class="container mt-4">
        <div class="alert alert-light shadow-sm rounded-3">
            <h5 class="mb-0">Salom, <strong>{{ user.username }}</strong> 👋</h5>
        </div>
    </div>


    <!-- MAIN CONTENT -->
    <main class="container my-5">
        {% block content %}
        {% endblock content %}
    </main>


    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p class="mb-1">© 2026 Blog2. Barcha huquqlar himoyalangan.</p>
            <small>Django + Bootstrap bilan yaratilgan</small>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
